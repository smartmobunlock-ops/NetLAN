name: Compilar APK Android (NetLAN)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite rodar manualmente clicando no botão 'Run workflow'

jobs:
  build:
    name: Gerar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permissão de execução ao Gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Compilar APK Debug com Gradle
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: NetLAN-Offline-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
