name: Compilar APK Android
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Extrair arquivos
        run: |
          if [ -f NetLAN-Projeto-Android.zip ]; then
            unzip -o NetLAN-Projeto-Android.zip || true
          fi

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilar APK Direto
        run: |
          BUILD_TOOLS=$ANDROID_HOME/build-tools/34.0.0
          PLATFORM=$ANDROID_HOME/platforms/android-34/android.jar
          
          mkdir -p build/gen build/obj build/apk
          $BUILD_TOOLS/aapt2 compile --dir app/src/main/res -o build/res.zip || true
          $BUILD_TOOLS/aapt2 link -I $PLATFORM --manifest app/src/main/AndroidManifest.xml --java build/gen -o build/base.apk build/res.zip || true
          javac -d build/obj -cp $PLATFORM $(find app/src/main/java build/gen -name "*.java") || true
          $BUILD_TOOLS/d8 --lib $PLATFORM --output build/apk/ $(find build/obj -name "*.class") || true
          cp build/base.apk NetLAN-Offline.apk
          cd build/apk && zip -u ../../NetLAN-Offline.apk classes.dex || true
          cd ../..
          $BUILD_TOOLS/apksigner sign --ks ~/.android/debug.keystore --ks-pass pass:android NetLAN-Offline.apk || true

      - name: Baixar APK
        uses: actions/upload-artifact@v4
        with:
          name: NetLAN-Offline-App
          path: NetLAN-Offline.apk
          if-no-files-found: warn
