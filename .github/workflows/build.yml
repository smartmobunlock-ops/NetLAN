name: Compilar APK Android
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Compilar APK com Gradle
        run: |
          unzip -o NetLAN-Projeto-Android.zip || true
          gradle assembleDebug || ./gradlew assembleDebug || true

      - name: Disponibilizar APK para Baixar
        uses: actions/upload-artifact@v4
        with:
          name: NetLAN-Offline-App
          path: app/build/outputs/apk/**/*.apk
