name: Compilar APK Android
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Criar Projeto com Ícone Personalizado e Compilar
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          # 1. Cria a estrutura de pastas incluindo drawables para o ícone
          mkdir -p app/src/main/java/com/mistfile/netlan app/src/main/res/layout app/src/main/res/values app/src/main/res/drawable

          # 2. Ícone Oficial do NetLAN (Wi-Fi Hotspot Neon Azul)
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Fundo Escuro Redondo -->
              <path
                  android:fillColor="#090d16"
                  android:pathData="M0,0h108v108h-108z"/>
              <!-- Borda de Rede Azul -->
              <path
                  android:fillColor="#0369a1"
                  android:pathData="M54,14 A40,40 0 1 0 54,94 A40,40 0 1 0 54,14 Z"/>
              <path
                  android:fillColor="#0f172a"
                  android:pathData="M54,18 A36,36 0 1 0 54,90 A36,36 0 1 0 54,18 Z"/>
              <!-- Ponto Central do Hotspot -->
              <path
                  android:fillColor="#38bdf8"
                  android:pathData="M54,64 A6,6 0 1 0 54,76 A6,6 0 1 0 54,64 Z"/>
              <!-- Ondas de Sinal Wi-Fi LAN -->
              <path
                  android:strokeColor="#38bdf8"
                  android:strokeWidth="5"
                  android:strokeLineCap="round"
                  android:pathData="M39,52 A20,20 0 0 1 69,52"/>
              <path
                  android:strokeColor="#0ea5e9"
                  android:strokeWidth="5"
                  android:strokeLineCap="round"
                  android:pathData="M29,40 A32,32 0 0 1 79,40"/>
              <path
                  android:strokeColor="#0284c7"
                  android:strokeWidth="5"
                  android:strokeLineCap="round"
                  android:pathData="M19,28 A44,44 0 0 1 89,28"/>
          </vector>
          EOF

          # 3. Manifesto apontando para o novo ícone @drawable/ic_launcher
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.mistfile.netlan">
              
              <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="34" />

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application 
                  android:label="NetLAN Offline"
                  android:icon="@drawable/ic_launcher"
                  android:roundIcon="@drawable/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".LocalLanVpnService" android:permission="android.permission.BIND_VPN_SERVICE" android:exported="false">
                      <intent-filter>
                          <action android:name="android.net.VpnService" />
                      </intent-filter>
                  </service>
                  <service android:name=".LanBroadcastRelay" android:exported="false" />
              </application>
          </manifest>
          EOF

          # 4. Layout
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:padding="20dp" android:background="#0b0f19" android:gravity="center">
              <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="NetLAN Offline" android:textColor="#38bdf8" android:textSize="22sp" />
              <TextView android:id="@+id/text_status" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="Status: Desconectado" android:textColor="#10b981" android:layout_marginTop="20dp" />
              <EditText android:id="@+id/edit_game_port" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="7777" android:textColor="#ffffff" android:layout_marginTop="10dp" />
              <Button android:id="@+id/btn_host" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="CRIAR SALA LAN (HOST)" android:layout_marginTop="20dp" />
              <Button android:id="@+id/btn_client" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="CONECTAR (CLIENTE)" android:layout_marginTop="10dp" />
              <Button android:id="@+id/btn_stop" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="DESCONECTAR" android:visibility="gone" android:layout_marginTop="10dp" />
          </LinearLayout>
          EOF

          # 5. Código Java
          cat << 'EOF' > app/src/main/java/com/mistfile/netlan/MainActivity.java
          package com.mistfile.netlan;
          import android.app.Activity;
          import android.content.Intent;
          import android.net.VpnService;
          import android.os.Bundle;
          import android.view.View;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.TextView;
          import android.widget.Toast;

          public class MainActivity extends Activity {
              private static final int VPN_REQUEST_CODE = 1001;
              private EditText editGamePort;
              private TextView textStatus;
              private Button btnHost, btnClient, btnStop;
              private boolean isHostMode = true;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  editGamePort = findViewById(R.id.edit_game_port);
                  textStatus = findViewById(R.id.text_status);
                  btnHost = findViewById(R.id.btn_host);
                  btnClient = findViewById(R.id.btn_client);
                  btnStop = findViewById(R.id.btn_stop);

                  btnHost.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) { isHostMode = true; startVpnProcess(); }
                  });
                  btnClient.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) { isHostMode = false; startVpnProcess(); }
                  });
                  btnStop.setOnClickListener(new View.OnClickListener() {
                      @Override
                      public void onClick(View v) { stopVpnProcess(); }
                  });
              }

              private void startVpnProcess() {
                  Intent vpnIntent = VpnService.prepare(this);
                  if (vpnIntent != null) startActivityForResult(vpnIntent, VPN_REQUEST_CODE);
                  else onActivityResult(VPN_REQUEST_CODE, RESULT_OK, null);
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  if (requestCode == VPN_REQUEST_CODE && resultCode == RESULT_OK) {
                      int port = 7777;
                      try { port = Integer.parseInt(editGamePort.getText().toString()); } catch (Exception ignored) {}
                      Intent sIntent = new Intent(this, LocalLanVpnService.class);
                      sIntent.putExtra("GAME_PORT", port);
                      startService(sIntent);
                      startService(new Intent(this, LanBroadcastRelay.class));
                      textStatus.setText("Status: " + (isHostMode ? "HOST ATIVO" : "CLIENTE CONECTADO"));
                      btnStop.setVisibility(View.VISIBLE);
                      Toast.makeText(this, "NetLAN Ativo!", Toast.LENGTH_SHORT).show();
                  }
              }

              private void stopVpnProcess() {
                  stopService(new Intent(this, LocalLanVpnService.class));
                  stopService(new Intent(this, LanBroadcastRelay.class));
                  textStatus.setText("Status: Desconectado");
                  btnStop.setVisibility(View.GONE);
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/mistfile/netlan/LocalLanVpnService.java
          package com.mistfile.netlan;
          import android.content.Intent;
          import android.net.VpnService;
          import android.os.ParcelFileDescriptor;
          import java.io.FileInputStream;
          import java.net.DatagramPacket;
          import java.net.DatagramSocket;
          import java.net.InetAddress;

          public class LocalLanVpnService extends VpnService implements Runnable {
              private ParcelFileDescriptor vpnInterface;
              private boolean isRunning = false;
              private DatagramSocket localSocket;
              private int targetGamePort = 7777;

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (isRunning) return START_STICKY;
                  if (intent != null && intent.hasExtra("GAME_PORT")) targetGamePort = intent.getIntExtra("GAME_PORT", 7777);
                  try {
                      Builder b = new Builder();
                      b.setSession("NetLAN").setMtu(1500).addAddress("10.0.0.2", 32).addRoute("0.0.0.0", 0);
                      try { b.addDisallowedApplication(getPackageName()); } catch (Exception ignored) {}
                      vpnInterface = b.establish();
                      localSocket = new DatagramSocket();
                      localSocket.setBroadcast(true);
                      isRunning = true;
                      new Thread(this).start();
                  } catch (Exception ignored) {}
                  return START_STICKY;
              }

              @Override
              public void run() {
                  if (vpnInterface == null) return;
                  try {
                      FileInputStream in = new FileInputStream(vpnInterface.getFileDescriptor());
                      byte[] buf = new byte[32768];
                      InetAddress bAddr = InetAddress.getByName("255.255.255.255");
                      while (isRunning) {
                          int len = in.read(buf);
                          if (len >= 28 && (buf[9] & 0xFF) == 17) {
                              int dst = ((buf[22] & 0xFF) << 8) | (buf[23] & 0xFF);
                              if (dst == targetGamePort) {
                                  localSocket.send(new DatagramPacket(buf, 28, len - 28, bAddr, 8888));
                              }
                          }
                      }
                  } catch (Exception ignored) {}
              }

              @Override
              public void onDestroy() {
                  isRunning = false;
                  try { if (localSocket != null) localSocket.close(); if (vpnInterface != null) vpnInterface.close(); } catch (Exception ignored) {}
                  super.onDestroy();
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/mistfile/netlan/LanBroadcastRelay.java
          package com.mistfile.netlan;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.net.wifi.WifiManager;
          import android.os.IBinder;
          import java.net.DatagramPacket;
          import java.net.DatagramSocket;

          public class LanBroadcastRelay extends Service implements Runnable {
              private WifiManager.MulticastLock lock;
              private DatagramSocket sock;
              private boolean isRunning = false;

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  if (isRunning) return START_STICKY;
                  try {
                      WifiManager wm = (WifiManager) getApplicationContext().getSystemService(Context.WIFI_SERVICE);
                      if (wm != null) {
                          lock = wm.createMulticastLock("NetLANLock");
                          lock.setReferenceCounted(true);
                          lock.acquire();
                      }
                      isRunning = true;
                      new Thread(this).start();
                  } catch (Exception ignored) {}
                  return START_STICKY;
              }

              @Override
              public void run() {
                  try {
                      sock = new DatagramSocket(8888);
                      sock.setBroadcast(true);
                      byte[] buf = new byte[4096];
                      DatagramPacket pkt = new DatagramPacket(buf, buf.length);
                      while (isRunning) { sock.receive(pkt); }
                  } catch (Exception ignored) {}
              }

              @Override
              public void onDestroy() {
                  isRunning = false;
                  try { if (sock != null) sock.close(); if (lock != null && lock.isHeld()) lock.release(); } catch (Exception ignored) {}
                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) { return null; }
          }
          EOF

          # 6. Compilação, montagem e inclusão dos drawables do ícone
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* | tail -n 1)/android.jar

          mkdir -p build/gen build/obj build/apk
          $BUILD_TOOLS/aapt2 compile --dir app/src/main/res -o build/res.zip
          $BUILD_TOOLS/aapt2 link -I $PLATFORM --manifest app/src/main/AndroidManifest.xml --java build/gen -o build/base.apk build/res.zip
          javac -d build/obj -cp $PLATFORM $(find app/src/main/java build/gen -name "*.java")
          $BUILD_TOOLS/d8 --lib $PLATFORM --output build/apk/ $(find build/obj -name "*.class")
          cp build/base.apk NetLAN-Raw.apk
          cd build/apk && zip -u ../../NetLAN-Raw.apk classes.dex && cd ../..

          # 7. Alinhamento e assinatura do APK
          $BUILD_TOOLS/zipalign -p -f 4 NetLAN-Raw.apk NetLAN-Aligned.apk
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android,O=Android,C=US"
          $BUILD_TOOLS/apksigner sign --ks debug.keystore --ks-pass pass:android --out NetLAN-Final.apk NetLAN-Aligned.apk

      - name: Baixar o APK com Ícone
        uses: actions/upload-artifact@v4
        with:
          name: NetLAN-Offline-App
          path: NetLAN-Final.apk
